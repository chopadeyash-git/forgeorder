spring.application.name=forgeorder

server.port=${PORT:8080}

# --- Database connection ---
# Supports individual DB_HOST / DB_PORT / DB_NAME (from Render Blueprint) or SPRING_DATASOURCE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:forgeorder}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:forgeorder_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:forgeorder_pass}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.data-source-properties.options=-c TimeZone=UTC

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Rabbit MQ ---
# Supports either SPRING_RABBITMQ_ADDRESSES (e.g. amqps://... CloudAMQP) or local fallback
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:amqp://${SPRING_RABBITMQ_USERNAME:forgeorder_user}:${SPRING_RABBITMQ_PASSWORD:forgeorder_pass}@${SPRING_RABBITMQ_HOST:localhost}:${SPRING_RABBITMQ_PORT:5672}}

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.missing-queues-fatal=false

# --- Redis ---
# Supports SPRING_DATA_REDIS_URL (from Render KeyValue) or local fallback
spring.data.redis.url=${SPRING_DATA_REDIS_URL:redis://${SPRING_DATA_REDIS_HOST:localhost}:${SPRING_DATA_REDIS_PORT:6379}}
